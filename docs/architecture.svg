<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <title>Vanterra architecture (as implemented)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa9c2"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5e9bff"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b48cff"/></marker>
    <style>
      .band { fill: #0e131a; stroke: #243040; }
      .box { fill: #141b25; stroke: #2e3c4e; }
      .phys { stroke: #e5b94e; }
      .cyb { stroke: #5e9bff; }
      .ai { stroke: #b48cff; stroke-dasharray: 5 4; }
      .hum { stroke: #4cb782; }
      .h { fill: #8d9aa8; font-size: 12px; letter-spacing: 1.6px; font-weight: 600; }
      .t { fill: #dce4eb; font-size: 14px; font-weight: 600; }
      .s { fill: #8d9aa8; font-size: 11.5px; }
      .p { fill: #58667a; font-size: 10.5px; font-family: Consolas, monospace; }
      .ln { stroke: #8fa9c2; stroke-width: 1.4; fill: none; }
      .lc { stroke: #5e9bff; stroke-width: 1.4; fill: none; }
      .lv { stroke: #b48cff; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#0a0d12"/>

  <!-- Simulation -->
  <rect class="band" x="20" y="20" width="1160" height="118" rx="8"/>
  <text class="h" x="36" y="42">SIMULATED WORLD  ·  src/simulation</text>
  <rect class="box phys" x="36" y="54" width="300" height="70" rx="6"/>
  <text class="t" x="50" y="78">Process model</text>
  <text class="s" x="50" y="97">32 assets · 84 signals at 4 Hz · seeded noise</text>
  <text class="s" x="50" y="114">faults: bearing wear, fan trip, MCC sag, sensor faults</text>
  <rect class="box cyb" x="372" y="54" width="300" height="70" rx="6"/>
  <text class="t" x="386" y="78">OT network &amp; security telemetry</text>
  <text class="s" x="386" y="97">5 zones · 14 devices · conduits · change records</text>
  <text class="s" x="386" y="114">records: logons, flow summaries, controller audit</text>
  <path class="lc" d="M372 106 H 336" marker-end="url(#c)"/>
  <text class="p" x="250" y="150">only path: PLC-500 fan speed setpoint</text>
  <rect class="box" x="708" y="54" width="456" height="70" rx="6"/>
  <text class="t" x="722" y="78">Scenario control</text>
  <text class="s" x="722" y="97">built-in scenarios (UI) · scenario language for evaluation:</text>
  <text class="s" x="722" y="114">timed faults, sensor faults, security records, engineering writes</text>

  <!-- Adapter -->
  <path class="ln" d="M186 138 V 172" marker-end="url(#a)"/>
  <path class="lc" d="M522 138 V 172" marker-end="url(#c)"/>
  <text class="p" x="200" y="160">DataSourceAdapter</text>
  <text class="p" x="536" y="160">SecuritySource (optional)</text>

  <!-- Core -->
  <rect class="band" x="20" y="176" width="1160" height="232" rx="8"/>
  <text class="h" x="36" y="198">ATLASCORE  ·  HEADLESS, DETERMINISTIC  ·  same code in browser, tests and evaluation</text>
  <rect class="box phys" x="36" y="212" width="170" height="64" rx="6"/>
  <text class="t" x="50" y="236">Telemetry</text>
  <text class="s" x="50" y="255">normalise · history</text>
  <text class="p" x="50" y="270">src/telemetry</text>
  <rect class="box phys" x="236" y="212" width="190" height="64" rx="6"/>
  <text class="t" x="250" y="236">Anomaly detection</text>
  <text class="s" x="250" y="255">6 detectors · re-baselining</text>
  <text class="p" x="250" y="270">src/anomaly</text>
  <rect class="box phys" x="456" y="212" width="210" height="64" rx="6"/>
  <text class="t" x="470" y="236">Correlation</text>
  <text class="s" x="470" y="255">asset graph · 9 physical rules</text>
  <text class="p" x="470" y="270">src/graph · src/intelligence</text>
  <rect class="box phys" x="696" y="212" width="250" height="64" rx="6"/>
  <text class="t" x="710" y="236">Physical intelligence</text>
  <text class="s" x="710" y="255">incidents · hypotheses · impact · checks</text>
  <text class="p" x="710" y="270">src/intelligence</text>
  <path class="ln" d="M206 244 H 236" marker-end="url(#a)"/>
  <path class="ln" d="M426 244 H 456" marker-end="url(#a)"/>
  <path class="ln" d="M666 244 H 696" marker-end="url(#a)"/>

  <rect class="box cyb" x="36" y="300" width="390" height="92" rx="6"/>
  <text class="t" x="50" y="324">Cyber Engine</text>
  <text class="s" x="50" y="343">5 rules: AUTH-BURST · ENG-SESSION · CONDUIT ·</text>
  <text class="s" x="50" y="360">FIRST-SEEN · UNAPPROVED-CHANGE · cases</text>
  <text class="s" x="50" y="377">ATT&amp;CK for ICS context (verified, never a finding)</text>
  <text class="p" x="330" y="324">src/cyber</text>

  <rect class="box" x="456" y="300" width="490" height="92" rx="6" stroke="#dce4eb"/>
  <text class="t" x="470" y="324">Cyber-physical assessment</text>
  <text class="s" x="470" y="343">links only via declared controls/parameters · precedence · signature</text>
  <text class="s" x="470" y="360">fault discriminator · 7 explicit conclusions · unknowns · next steps</text>
  <text class="s" x="470" y="377">read-only: cannot change an incident or a verdict</text>
  <text class="p" x="842" y="324">src/cyber/assess.ts</text>
  <path class="lc" d="M426 346 H 456" marker-end="url(#c)"/>
  <path class="ln" d="M821 276 V 300" marker-end="url(#a)"/>

  <rect class="box" x="976" y="212" width="188" height="180" rx="6"/>
  <text class="t" x="990" y="236">Evaluation</text>
  <text class="s" x="990" y="256">counterfactual twins</text>
  <text class="s" x="990" y="274">physical · cyber-physical</text>
  <text class="s" x="990" y="292">governance (adversarial)</text>
  <text class="s" x="990" y="310">independent, blind-</text>
  <text class="s" x="990" y="326">authored scenarios</text>
  <text class="s" x="990" y="344">live model (optional)</text>
  <text class="p" x="990" y="380">src/eval · npm run eval</text>

  <!-- Browser -->
  <path class="ln" d="M400 408 V 446" marker-end="url(#a)"/>
  <text class="p" x="414" y="432">UI store snapshots (4 Hz) · scene feed</text>
  <rect class="band" x="20" y="450" width="760" height="190" rx="8"/>
  <text class="h" x="36" y="472">BROWSER  ·  src/ui · src/spatial</text>
  <rect class="box" x="36" y="486" width="170" height="64" rx="6"/>
  <text class="t" x="50" y="510">Overview</text>
  <text class="s" x="50" y="529">computed status, attention</text>
  <rect class="box" x="216" y="486" width="170" height="64" rx="6"/>
  <text class="t" x="230" y="510">Spatial</text>
  <text class="s" x="230" y="529">Three.js twin + OT layer</text>
  <rect class="box" x="396" y="486" width="180" height="64" rx="6"/>
  <text class="t" x="410" y="510">Investigation</text>
  <text class="s" x="410" y="529">workbench, 7 tabs</text>
  <rect class="box cyb" x="586" y="486" width="180" height="64" rx="6"/>
  <text class="t" x="600" y="510">Cyber &amp; OT</text>
  <text class="s" x="600" y="529">zones, cases, events</text>
  <rect class="box hum" x="36" y="566" width="730" height="58" rx="6"/>
  <text class="t" x="50" y="590">Human verification</text>
  <text class="s" x="220" y="590">only an operator confirms or rules out a hypothesis (IntelligenceEngine.setDisposition)</text>
  <text class="s" x="50" y="610">rule-based, cyber-physical, AI-assisted and human verdicts are shown side by side; nothing automated can confirm</text>

  <!-- AI -->
  <rect class="band" x="810" y="450" width="370" height="290" rx="8" stroke="#3a2f52"/>
  <text class="h" x="826" y="472">OPTIONAL AI REVIEW  ·  server/ · src/agents</text>
  <rect class="box ai" x="826" y="486" width="338" height="96" rx="6"/>
  <text class="t" x="840" y="510">Five-agent workflow (code-orchestrated)</text>
  <text class="s" x="840" y="529">Evidence ∥ Impact → Hypothesis → Planner → Orchestrator</text>
  <text class="s" x="840" y="546">≤ 2 calls/agent · timeouts · deadline · audit</text>
  <text class="s" x="840" y="563">schema gate + grounding gate (IDs, certainty,</text>
  <text class="s" x="840" y="578">probability, causal overreach)</text>
  <rect class="box ai" x="826" y="598" width="104" height="58" rx="6"/>
  <text class="t" x="838" y="622">Claude</text>
  <text class="s" x="838" y="640">API key</text>
  <rect class="box ai" x="942" y="598" width="104" height="58" rx="6"/>
  <text class="t" x="954" y="622">Ollama</text>
  <text class="s" x="954" y="640">local, no cost</text>
  <rect class="box" x="1058" y="598" width="106" height="58" rx="6" stroke="#58667a" stroke-dasharray="3 3"/>
  <text class="t" x="1068" y="622">Test double</text>
  <text class="s" x="1068" y="640">tests, labelled</text>
  <text class="s" x="826" y="680">Key stays in the Node process. Reports sit beside</text>
  <text class="s" x="826" y="697">incidents, never inside them. Without a provider,</text>
  <text class="s" x="826" y="714">AI is reported unavailable; nothing else changes.</text>
  <path class="lv" d="M780 518 H 826" marker-end="url(#v)"/>
  <text class="p" x="784" y="510">context</text>
  <path class="lv" d="M826 560 H 780" marker-end="url(#v)"/>
  <text class="p" x="786" y="576">report</text>

  <text class="p" x="20" y="700">Solid: deterministic data flow · Dashed violet: optional, advisory AI path</text>
  <text class="p" x="20" y="718">Amber: physical domain · Azure: cyber domain · Green: human decision · Everything runs on simulated data.</text>
</svg>
